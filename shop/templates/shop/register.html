{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Inscription - Yamsu Chance Fashion</title>

<link rel="stylesheet" href="{% static 'shop/style.css' %}">

</head>


<body>


<header>

<h1>
Yamsu Chance Fashion
</h1>

</header>



<h2>
Créer un compte
</h2>




<form method="POST">

{% csrf_token %}


<label>
Nom d'utilisateur
</label>

<br>

<input type="text" name="username" required>


<br><br>


<label>
Mot de passe
</label>

<br>

<input type="password" name="password" required>


<br><br>


<button type="submit">
S'inscrire
</button>


</form>




<p>

Déjà un compte ?

<a href="{% url 'login' %}">
Se connecter
</a>

</p>



<footer>

<p>
© 2026 Yamsu Chance Fashion - Tous droits réservés.
</p>

</footer>



</body>

</html>
